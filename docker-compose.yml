services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-novel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_novel}
      POSTGRES_USER: ${POSTGRES_USER:-ainovel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainovel} -d ${POSTGRES_DB:-ai_novel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-story-network
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}
      - -c
      - default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET:-100}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}

  ai-novel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-novel:latest
    container_name: ai-novel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8000"
    volumes:
      - ./logs:/app/logs
      - ./storage/generated_covers:/app/storage/generated_covers
      - ./.env:/app/.env:ro
    environment:
      # 时区配置
      - TZ=${TZ:-Asia/Shanghai}

      # 应用与品牌配置
      - APP_NAME=${APP_NAME:-AI 小说创作台}
      - APP_VERSION=${APP_VERSION:-1.5.8}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=8000
      - APP_SLOGAN=${APP_SLOGAN:-只做创作台的自托管 AI 小说工作台}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-面向小说创作者的 AI 创作台：世界设定、大纲、角色、章节写作与全书导出。}
      - BRAND_PRIMARY_COLOR=${BRAND_PRIMARY_COLOR:-#4D8088}
      - BRAND_ACCENT_COLOR=${BRAND_ACCENT_COLOR:-#C08A6A}
      - BRAND_FOOTER_NOTE=${BRAND_FOOTER_NOTE:-基于 MuMuAINovel 修改 · GPL v3}
      - UPSTREAM_NAME=${UPSTREAM_NAME:-MuMuAINovel}
      - UPSTREAM_URL=${UPSTREAM_URL:-https://github.com/xiamuceer-j/MuMuAINovel}
      - LICENSE_NAME=${LICENSE_NAME:-GPL-3.0}
      - LICENSE_URL=${LICENSE_URL:-https://www.gnu.org/licenses/gpl-3.0.html}
      - AI_CONTENT_NOTICE=${AI_CONTENT_NOTICE:-本站生成内容由 AI 辅助完成，请在发布或商用前进行人工审校。}
      - DEBUG=${DEBUG:-false}

      # 数据库配置
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ainovel}:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/${POSTGRES_DB:-ai_novel}

      # 数据库连接信息（用于 entrypoint.sh）
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-env}

      # PostgreSQL 连接池配置
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-30}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - DATABASE_POOL_TIMEOUT=${DATABASE_POOL_TIMEOUT:-60}
      - DATABASE_POOL_RECYCLE=${DATABASE_POOL_RECYCLE:-1800}
      - DATABASE_POOL_PRE_PING=${DATABASE_POOL_PRE_PING:-True}
      - DATABASE_POOL_USE_LIFO=${DATABASE_POOL_USE_LIFO:-True}

      # 全局代理配置（可选）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}

      # 模型服务商默认配置（用户可在设置页按账号覆盖）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-32000}
      - ALLOW_PRIVATE_AI_ENDPOINTS=${ALLOW_PRIVATE_AI_ENDPOINTS:-false}
      - ALLOWED_AI_HOSTS=${ALLOWED_AI_HOSTS:-}

      # 本地账户登录配置
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8090}

      # 会话与密钥配置（生产环境请务必替换为高强度随机值）
      - SESSION_EXPIRE_MINUTES=${SESSION_EXPIRE_MINUTES:-120}
      - SESSION_REFRESH_THRESHOLD_MINUTES=${SESSION_REFRESH_THRESHOLD_MINUTES:-30}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}

      # 上游云服务（提示词工坊/云端公告）与更新日志开关
      - CLOUD_SERVICES_ENABLED=${CLOUD_SERVICES_ENABLED:-false}
      - CHANGELOG_ENABLED=${CHANGELOG_ENABLED:-true}
      - CHANGELOG_REPO_OWNER=${CHANGELOG_REPO_OWNER:-hjm222222}
      - CHANGELOG_REPO_NAME=${CHANGELOG_REPO_NAME:-MuMuAINovel}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-story-network

volumes:
  postgres_data:
    driver: local

networks:
  ai-story-network:
    driver: bridge
